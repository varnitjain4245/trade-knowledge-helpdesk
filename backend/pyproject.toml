[project]
name = "scc-knowledge-platform"
version = "0.1.0"
description = "Smart Contact-Center Knowledge Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery>=5.4",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "pyjwt[crypto]>=2.10",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "testcontainers[postgres,redis]>=4.8", "schemathesis>=3.38", "ruff>=0.8", "bandit>=1.8", "pip-audit>=2.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) allowed in tests only; T201 print banned per guardrail G10.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
